<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dreamina Scheduler</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #f4f7fc;
      }

      body {
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .boot-shell {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        grid-template-columns: 88px 1fr;
        background: #f4f7fc;
        color: #1f2944;
      }

      .boot-rail {
        border-right: 1px solid #dce4f1;
        background: #ffffff;
      }

      .boot-main {
        padding: 58px 28px 28px;
      }

      .boot-heading {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
        font-size: 18px;
        font-weight: 700;
      }

      .boot-mark {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        background: #5b5cf6;
      }

      .boot-lanes {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .boot-card {
        height: 176px;
        padding: 22px;
        border: 1px solid #dce4f1;
        border-radius: 8px;
        background: #ffffff;
        box-sizing: border-box;
      }

      .boot-line {
        height: 12px;
        margin-bottom: 14px;
        border-radius: 4px;
        background: #e6ebf4;
        animation: boot-pulse 1.2s ease-in-out infinite alternate;
      }

      .boot-line.short {
        width: 38%;
      }

      .boot-line.medium {
        width: 68%;
      }

      @keyframes boot-pulse {
        to { opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <div id="boot-screen" class="boot-shell" aria-label="正在载入任务">
      <div class="boot-rail"></div>
      <div class="boot-main">
        <div class="boot-heading"><span class="boot-mark"></span>正在载入任务</div>
        <div class="boot-lanes">
          <div class="boot-card">
            <div class="boot-line short"></div>
            <div class="boot-line medium"></div>
            <div class="boot-line"></div>
          </div>
          <div class="boot-card">
            <div class="boot-line short"></div>
            <div class="boot-line medium"></div>
            <div class="boot-line"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
